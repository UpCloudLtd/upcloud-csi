{{- if .Values.snapshotController.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-upcloud-snapshot-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upcloud-csi-driver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.snapshotController.replicas }}
  selector:
    matchLabels:
      app: csi-upcloud-snapshot-controller
  # The snapshot controller exits after about 7.5s when the v1 CRDs are missing.
  # minReadySeconds stays above that so a missing CRD does not look ready.
  minReadySeconds: 15
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: csi-upcloud-snapshot-controller
        {{- include "upcloud-csi-driver.labels" . | nindent 8 }}
    spec:
      serviceAccount: csi-upcloud-controller-sa
      containers:
        - name: snapshot-controller
          image: {{ include "upcloud-csi-driver.image" .Values.sidecars.snapshotController }}
          args:
            - "--v=5"
            - "--leader-election=true"
          imagePullPolicy: IfNotPresent
          {{- with .Values.resources.snapshotController }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
