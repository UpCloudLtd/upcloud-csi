{{/* Cluster-scoped. The static manifest sets namespace; kubectl drops it and Helm rejects it. */}}
{{- if .Values.storageClasses.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: upcloud-block-storage-maxiops
  labels:
    {{- include "upcloud-csi-driver.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: {{ .Values.storageClasses.isDefault | quote }}
parameters:
  tier: maxiops
provisioner: storage.csi.upcloud.com
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: upcloud-block-storage-hdd
  labels:
    {{- include "upcloud-csi-driver.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
parameters:
  tier: hdd
provisioner: storage.csi.upcloud.com
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: upcloud-block-storage-standard
  labels:
    {{- include "upcloud-csi-driver.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
parameters:
  tier: standard
provisioner: storage.csi.upcloud.com
allowVolumeExpansion: true
reclaimPolicy: Retain
{{- end }}
